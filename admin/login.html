<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | ExamAce</title>
<link rel="stylesheet" href="../css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
.admin-login-bg {
  min-height:100vh;
  background:linear-gradient(135deg,#0f172a 0%, #1e3a8a 50%, #4c1d95 100%);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.admin-login-card {
  background:#fff;border-radius:16px;padding:44px;
  max-width:440px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.admin-icon {
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,#0b5ed7,#7c3aed);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;color:#fff;font-size:2rem;
}
.admin-error {
  background:#fee2e2;color:#991b1b;padding:10px 14px;
  border-radius:8px;font-size:.9rem;margin-bottom:14px;
  min-height:20px;
}
.demo-creds {
  background:#fffbeb;border:1px dashed #f59e0b;
  padding:12px;border-radius:8px;margin-top:20px;
  font-size:.85rem;color:#92400e;
}
</style>
</head>
<body>
<div class="admin-login-bg">
  <div class="admin-login-card">
    <div class="admin-icon"><i class="fas fa-user-shield"></i></div>
    <h2 style="text-align:center;margin-bottom:6px;">Admin Portal</h2>
    <p style="text-align:center;color:#6b7280;margin-bottom:24px;">Sign in to manage profiles & content</p>

    <div class="admin-error" id="adminError"></div>

    <form onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="adminUser" placeholder="admin" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPass" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary btn-full">
        <i class="fas fa-sign-in-alt"></i> Login to Dashboard
      </button>
    </form>

    <div class="demo-creds">
      <strong>🔑 Demo credentials:</strong><br>
      Username: <code>admin</code> &nbsp;&nbsp; Password: <code>admin123</code>
    </div>

    <p style="text-align:center;margin-top:20px;font-size:.9rem;">
      <a href="../index.html" style="color:#0b5ed7;"><i class="fas fa-arrow-left"></i> Back to main site</a>
    </p>
  </div>
</div>
<script src="../js/main.js"></script>
</body>
</html>
