<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Sign Up | ExamAce</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header class="main-header">
  <nav class="nav-container">
    <div class="logo"><a href="index.html"><i class="fas fa-graduation-cap"></i><span>Exam<strong>Ace</strong></span></a></div>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="subjects.html">Subjects</a></li>
      <li><a href="practice.html">Practice</a></li>
      <li><a href="solutions.html">Solutions</a></li>
    </ul>
    <div class="hamburger" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
  </nav>
</header>

<section class="auth-page">
  <div class="auth-card">
    <div class="tab-buttons">
      <button class="active" onclick="switchTab('login-pane')">Sign In</button>
      <button onclick="switchTab('signup-pane')">Sign Up</button>
    </div>

    <div id="login-pane" class="tab-pane">
      <h2>Welcome Back 👋</h2>
      <p class="sub">Sign in to track your progress</p>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPass" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary btn-full">Sign In <i class="fas fa-arrow-right"></i></button>
      </form>
      <p class="auth-switch">No account yet? <a onclick="document.querySelectorAll('.tab-buttons button')[1].click()" style="cursor:pointer;">Create one</a></p>
    </div>

    <div id="signup-pane" class="tab-pane" style="display:none;">
      <h2>Create Account 🚀</h2>
      <p class="sub">Join 50,000+ students preparing for WAEC & GCE</p>
      <form onsubmit="handleSignup(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signupName" placeholder="Jane Doe" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPass" placeholder="At least 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label>Exam Target</label>
          <select required>
            <option value="">Select exam</option>
            <option>WAEC SSCE</option>
            <option>GCE (May/June)</option>
            <option>GCE (Nov/Dec)</option>
            <option>NECO</option>
            <option>Both WAEC & GCE</option>
          </select>
        </div>
        <button type="submit" class="btn-primary btn-full">Create Account <i class="fas fa-rocket"></i></button>
      </form>
      <p class="auth-switch">Already a member? <a onclick="document.querySelectorAll('.tab-buttons button')[0].click()" style="cursor:pointer;">Sign in</a></p>
    </div>
  </div>
</section>

<script src="js/main.js"></script>
</body>
</html>
